<div class="showcase-shell">
  <header class="showcase-header">
    <div class="showcase-header__inner">
      <a class="showcase-brand" routerLink="/" aria-label="Ir a la página de inicio">
        <h1 class="showcase-brand__title">Storage Manager Showcase</h1>
        <span class="showcase-brand__subtitle">ngx-uceva-storage-manager</span>
      </a>

      <nav class="showcase-nav" aria-label="Navegación principal">
        <a
          class="showcase-nav__link"
          routerLink="/"
          routerLinkActive="showcase-nav__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          ariaCurrentWhenActive="page"
        >
          Inicio
        </a>
        <a
          class="showcase-nav__link"
          routerLink="/local-storage"
          routerLinkActive="showcase-nav__link--active"
          ariaCurrentWhenActive="page"
        >
          LocalStorage
        </a>
        <a
          class="showcase-nav__link"
          routerLink="/cache-storage"
          routerLinkActive="showcase-nav__link--active"
          ariaCurrentWhenActive="page"
        >
          Cache Storage
        </a>
      </nav>
    </div>
  </header>

  <main class="showcase-main">
    <router-outlet />
  </main>

  <footer class="showcase-footer">
    <div class="showcase-footer__inner">
      <span>ngx-uceva-storage-manager</span>
      <span>Proyecto de Arquitectura de Software - UCEVA</span>
    </div>
  </footer>
</div>
