name: CI/CD

# Integración y despliegue continuo del Showcase de ngx-uceva-storage-manager:
# se prueban y compilan ambos proyectos, se publica el Showcase en GitHub Pages
# y se verifica que la URL publicada responda.

on:
  # Validación en cada push y pull request sobre la rama por defecto.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ejecución manual desde la pestaña Actions.
  workflow_dispatch:

# Permisos mínimos por defecto; el job de despliegue los amplía.
permissions:
  contents: read

# Una ejecución por referencia; un push nuevo cancela la anterior.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y compilación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          # Angular 22.2 exige Node ^22.22.3 || ^24.15.0; se usa la última 24 LTS.
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Pruebas unitarias de la librería (el script ya incluye --watch=false).
      - name: Ejecutar pruebas de la librería
        run: npm test

      # Solo se valida que la librería compile; no se publica en NPM.
      - name: Compilar la librería
        run: npm run build:lib

      # Build de producción del Showcase con la ruta base del repositorio.
      - name: Compilar el Showcase
        run: npm run build:showcase -- --base-href /Project-Store-Manager-Actividad/

      # El Showcase usa PathLocationStrategy: GitHub Pages devuelve 404 en rutas
      # profundas, así que se publica el index como 404.html para que el router cargue.
      - name: Copiar index.html a 404.html
        run: cp dist/showcase/browser/index.html dist/showcase/browser/404.html

      - name: Validar artefactos del build
        run: |
          SALIDA=dist/showcase/browser

          if [ ! -f "$SALIDA/index.html" ]; then
            echo "::error::No se encontró $SALIDA/index.html"
            exit 1
          fi

          if [ ! -f "$SALIDA/404.html" ]; then
            echo "::error::No se encontró $SALIDA/404.html en el directorio de salida"
            exit 1
          fi

          if ! grep -qF 'base href="/Project-Store-Manager-Actividad/"' "$SALIDA/index.html"; then
            echo "::error::El index.html no contiene el base href /Project-Store-Manager-Actividad/"
            exit 1
          fi

      # El artefacto solo se prepara para publicar desde la rama por defecto,
      # nunca en pull requests ni en pushes a otras ramas.
      - name: Configurar Pages
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Subir artefacto de Pages
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/showcase/browser

  deploy:
    name: Desplegar en GitHub Pages
    needs: build
    # Solo despliega desde la rama por defecto, no en pull requests.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # Un único despliegue de Pages a la vez, sin cancelar el que esté en curso.
    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Permisos que exige deploy-pages para publicar el artefacto.
    permissions:
      contents: read
      pages: write
      id-token: write

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    name: Verificar despliegue
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verificar la publicación
        id: verificacion
        env:
          URL_BASE: ${{ needs.deploy.outputs.page_url }}
          INTENTOS_MAX: 10
          SEGUNDOS_ESPERA: 15
        run: |
          # GitHub Pages responde 301 si la URL base se consulta sin barra final.
          URL="${URL_BASE%/}"
          MAX="${INTENTOS_MAX}"
          ESPERA="${SEGUNDOS_ESPERA}"

          # La primera publicación puede tardar; se reintenta hasta 10 veces.
          INTENTO=1
          CODIGO=000
          while [ "$INTENTO" -le "$MAX" ]; do
            CODIGO=$(curl --silent --show-error --output "$RUNNER_TEMP/index-base.html" --write-out "%{http_code}" "$URL/")
            if [ "$CODIGO" = "200" ]; then
              break
            fi
            INTENTO=$((INTENTO + 1))
            if [ "$INTENTO" -le "$MAX" ]; then
              sleep "$ESPERA"
            fi
          done

          if [ "$CODIGO" != "200" ]; then
            echo "::error::La URL base ${URL}/ respondió ${CODIGO} después de $MAX intentos. No se pudo verificar el despliegue."
            exit 1
          fi

          if ! grep -q "<app-root" "$RUNNER_TEMP/index-base.html"; then
            echo "::error::El HTML publicado en ${URL} no contiene el marcador <app-root>."
            exit 1
          fi

          # Se toma el primer src del HTML y se quita la ruta base si viene absoluta.
          BUNDLE=$(grep -oE 'src="[^"]+"' "$RUNNER_TEMP/index-base.html" | head -n 1 | sed -e 's/^src="//' -e 's/"$//' -e 's|^/Project-Store-Manager-Actividad/||')
          if [ -z "$BUNDLE" ]; then
            echo "::error::No se detectó el bundle JavaScript en el HTML publicado."
            exit 1
          fi

          BUNDLE_CODE=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" "$URL/$BUNDLE")
          if [ "$BUNDLE_CODE" != "200" ]; then
            echo "::error::El bundle ${BUNDLE} respondió ${BUNDLE_CODE}, se esperaba 200."
            exit 1
          fi

          # Ruta profunda real del Showcase. Puede responder 404 y aun así servir
          # el 404.html con <app-root>, que es el comportamiento esperado.
          RUTA_PROFUNDA="local-storage"
          RUTA_CODE=$(curl --silent --show-error --output "$RUNNER_TEMP/index-ruta.html" --write-out "%{http_code}" "$URL/$RUTA_PROFUNDA")
          RUTA_OK="false"
          if grep -q "<app-root" "$RUNNER_TEMP/index-ruta.html"; then
            RUTA_OK="true"
          fi

          {
            echo "### Verificación del despliegue en GitHub Pages"
            echo ""
            echo "- URL publicada: \`${URL}/\`"
            echo "- URL base: respuesta HTTP ${CODIGO}; contiene \`<app-root\`: OK"
            echo "- Bundle principal (\`${BUNDLE}\`): respuesta HTTP ${BUNDLE_CODE}; esperado 200: OK"
            echo "- Ruta profunda /${RUTA_PROFUNDA}: respuesta HTTP ${RUTA_CODE}; contiene \`<app-root\`: ${RUTA_OK}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RUTA_OK" != "true" ]; then
            echo "::error::La ruta /${RUTA_PROFUNDA} no devolvió el marcador <app-root>; el truco del 404.html no se aplicó como se esperaba."
            exit 1
          fi
